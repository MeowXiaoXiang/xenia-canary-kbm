name: Windows (x86-64)

on:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: windows-2025-vs2026

    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
      VULKAN_SDK_VERSION: '1.4.363.0'
      VULKAN_SDK_SHA256: '94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch integrated upstream base for build version
        run: |-
          git remote add upstream https://github.com/xenia-canary/xenia-canary.git
          git fetch --no-tags upstream canary_experimental:refs/remotes/upstream/canary_experimental

      - name: Cache Vulkan SDK
        uses: actions/cache@v6
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: ${{ runner.os }}-${{ runner.arch }}-vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK with spirv-tools
        run: |-
          $version = $env:VULKAN_SDK_VERSION
          $sdk = "C:\VulkanSDK\$version"
          $bin = Join-Path $sdk 'Bin'
          if (!(Test-Path -LiteralPath $sdk -PathType Container)) {
            $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-windows-X64-$version.exe"
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
            if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $env:VULKAN_SDK_SHA256) {
              throw "Vulkan SDK $version installer checksum mismatch"
            }
            $process = Start-Process -FilePath $installer -ArgumentList "--root", $sdk, "--accept-licenses", "--default-answer", "--confirm-command", "install" -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Vulkan SDK $version installer exited with code $($process.ExitCode)"
            }
          }

          # Verify shader tools are available
          foreach ($tool in @("glslangValidator", "spirv-opt", "spirv-dis")) {
            $toolPath = Join-Path $bin "$tool.exe"
            if (!(Test-Path -LiteralPath $toolPath -PathType Leaf)) {
              throw "Vulkan SDK $version is missing $tool.exe"
            }
            & $toolPath --version
            if ($LASTEXITCODE -ne 0) {
              throw "Vulkan SDK $version could not run $tool.exe"
            }
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH

          # Verify FXC is available (from Windows SDK)
          $fxcPaths = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName
          if ($fxcPaths) {
            $fxcPath = $fxcPaths[-1].FullName
            echo "FXC found at: $fxcPath"
          } else {
            echo "Warning: fxc.exe not found in Windows SDK"
          }

      - name: Download submodules
        run: |- # Exclude unneeded submodules
          $SUBMODULES=(Select-String -CaseSensitive '(?<=path = )(?!third_party\/xbyak_aarch64).+' .gitmodules).Matches.Value
          git submodule update --init --depth=1 -j $env:NUMBER_OF_PROCESSORS $SUBMODULES

      - name: Build Xenia
        run: >-
          python xenia-build.py build --config=Release --build-tests
          --target=xenia-app
          --target=xenia-hid-kbm-core-tests
          --target=xenia-hid-kbm-config-tests
          --target=xenia-hid-kbm-lifecycle-tests
          --target=xenia-hid-kbm-sampling-tests
          --target=xenia-app-localization-tests

      - name: Test KBM and localization
        run: >-
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
          -R "^xenia-(hid-kbm-(core|config|lifecycle|sampling)-tests|app-localization-tests)$"

      - name: Test KBM replay tools
        run: python -m unittest discover -s tools -p "kbm_*test.py"

      - name: Prepare artifacts
        id: prepare_artifacts
        run: |-
          if ((Get-Item "build\bin\Windows\Release\xenia_canary.exe").Length -le 100000) {
            echo "::error:: Executable is too small."
            exit 1
          }
          $path="xenia_canary_kbm_windows.7z"
          7z a $path .\build\bin\Windows\Release\xenia_canary.exe LICENSE -mx9 -bb3
          if ((Get-Item "$path").Length -le 100000) {
            echo "::error:: Archive is too small."
            exit 1
          }
          echo "path=$path" >> $env:GITHUB_OUTPUT

      - name: Upload KBM Windows artifact
        if: ${{ steps.prepare_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: xenia_canary_kbm_windows
          path: ${{ steps.prepare_artifacts.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          archive: false
