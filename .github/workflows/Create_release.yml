name: Create KBM Release

on:
  workflow_call:
    inputs:
      commit:
        description: Full fork commit SHA to release
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository for release notes and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FULL_SHA: ${{ inputs.commit }}
        run: |-
          set -euo pipefail
          SHORT_SHA="${FULL_SHA:0:12}"
          TAG_NAME="kbm-${SHORT_SHA}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          # Never reuse a tag that points to another build.
          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            TAG_SHA=$(git rev-parse "refs/tags/$TAG_NAME^{}")
            if [ "$TAG_SHA" != "$FULL_SHA" ]; then
              echo "::error::Tag $TAG_NAME points to $TAG_SHA, not $FULL_SHA"
              exit 1
            fi
          fi

          PREV_TAG=$(gh release list --repo "$REPO" --exclude-drafts --limit 100 \
            --json tagName \
            --jq '[.[] | select(.tagName | startswith("kbm-"))][0].tagName // ""')

          {
            echo 'Unofficial Windows build of Xenia Canary - KBM Controller Input.'
            echo
            echo "Fork commit: $FULL_SHA"
            echo
            if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG_NAME" ]; then
              PREV_SHA=$(git rev-parse "refs/tags/$PREV_TAG^{}")
              if ! git merge-base --is-ancestor "$PREV_SHA" "$FULL_SHA"; then
                echo "::error::Previous release $PREV_TAG is not an ancestor of $FULL_SHA" >&2
                exit 1
              fi
              echo '### Changes since the previous KBM release'
              git log --format='- %s (`%h`)' "$PREV_SHA..$FULL_SHA" --
              echo
              echo "Full changelog: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG_NAME}"
            else
              git fetch --no-tags \
                https://github.com/xenia-canary/xenia-canary.git \
                canary_experimental
              BASE_SHA=$(git merge-base "$FULL_SHA" FETCH_HEAD)
              echo '### Fork changes since the integrated upstream base'
              git log --format='- %s (`%h`)' "$BASE_SHA..$FULL_SHA" --
              echo
              echo "Full changelog: https://github.com/${REPO}/compare/${BASE_SHA}...${TAG_NAME}"
            fi
          } > release_notes.md

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.notes.outputs.tag_name }}
          FULL_SHA: ${{ inputs.commit }}
        run: |-
          set -euo pipefail
          ASSET=release_assets/xenia_canary_kbm_windows.7z

          if [ ! -f "$ASSET" ]; then
            echo "::error::Expected Windows archive was not downloaded: $ASSET"
            find release_assets -maxdepth 2 -type f -print || true
            exit 1
          fi

          ASSET_SIZE=$(stat -c%s "$ASSET")
          if [ "$ASSET_SIZE" -le 100000 ]; then
            echo "::error::Windows archive is unexpectedly small: ${ASSET_SIZE} bytes"
            exit 1
          fi

          ASSET_SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          echo "Release asset: $ASSET"
          echo "Release asset size: ${ASSET_SIZE} bytes"
          echo "Release asset SHA256: $ASSET_SHA256"

          if gh release view "$TAG_NAME" --repo "$REPO" --json tagName >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG_NAME" --repo "$REPO" \
              --json isDraft --jq '.isDraft')

            if [ "$IS_DRAFT" = true ]; then
              # A draft is not public yet, so a retry can replace its archive.
              gh release upload "$TAG_NAME" --repo "$REPO" --clobber "$ASSET"
              gh release edit "$TAG_NAME" --repo "$REPO" --draft=false --latest
              exit 0
            fi

            HAS_ASSET=$(gh release view "$TAG_NAME" --repo "$REPO" \
              --json assets --jq 'any(.assets[]; .name == "xenia_canary_kbm_windows.7z")')
            if [ "$HAS_ASSET" != true ]; then
              echo "::error::Published release $TAG_NAME is missing its Windows archive"
              exit 1
            fi
            echo "Release $TAG_NAME already has its Windows archive; leaving it unchanged."
            exit 0
          fi

          gh release create "$TAG_NAME" \
            --repo "$REPO" \
            --target "$FULL_SHA" \
            --title "KBM Controller Input main@${FULL_SHA:0:12}" \
            --notes-file release_notes.md \
            --latest \
            "$ASSET"
