name: Orchestrator

on:
  push:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Pre-requirements
  # ===========================================================================
  commit-message:
    name: Commit Message Validation
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/Check_commit_message.yml

  lint:
    name: Lint
    uses: ./.github/workflows/Lint.yml
    with:
      runs-on: ubuntu-24.04
      llvm_version: 20

  # Add optional steps here

  # ===========================================================================
  # Stage 2: Platform builds
  # ===========================================================================
  build-windows:
    name: Windows (x86-64)
    needs: [lint, commit-message]
    if: >-
      ${{ always() &&
      needs.lint.result == 'success' &&
      (needs.commit-message.result == 'success' || needs.commit-message.result == 'skipped') }}
    uses: ./.github/workflows/Windows_x86.yml

  # Uncomment when platform support is ready:
