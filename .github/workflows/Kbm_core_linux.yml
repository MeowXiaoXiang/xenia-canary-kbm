name: Linux KBM Core

on:
  workflow_call:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |-
          sudo apt-get update
          sudo apt-get -y install cmake ninja-build pkg-config libgtk-3-dev \
            libsdl2-dev libvulkan-dev libx11-xcb-dev spirv-tools glslang-tools

      - name: Download submodules
        run: |- # Exclude unneeded platform-only submodules
          SUBMODULES=$(grep -oP '(?<=path = )(?!third_party\/(?:DirectX(?:-Headers|ShaderCompiler)|xbyak_aarch64)).+' .gitmodules)
          git submodule update --init --depth=1 -j$(getconf _NPROCESSORS_ONLN) $SUBMODULES

      - name: Build portable KBM core tests
        run: |-
          cmake -S . -B build-linux-kbm -G Ninja -DXENIA_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS=-mmovdir64b
          cmake --build build-linux-kbm --target xenia-hid-kbm-core-tests xenia-app-localization-tests

      - name: Run portable KBM core tests
        run: ctest --test-dir build-linux-kbm --output-on-failure -R "xenia-(hid-kbm-core-tests|app-localization-tests)"
